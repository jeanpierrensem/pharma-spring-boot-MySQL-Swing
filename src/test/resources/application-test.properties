spring.datasource.url=jdbc:h2:mem:officine_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

officine.bon.restrict-central-warehouse-role=false

# Pas de Redis reel en test : voir com.officine.losto.config.RedisTestConfig
# (bean StringRedisTemplate factice) et mocker LoginRateLimiter avec @MockBean
# dans les tests qui exercent reellement AuthService/AuthenticationController.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
