spring.jpa.show-sql=false
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Active la prise en compte des en-tetes X-Forwarded-* par le connecteur Tomcat embarque (via son RemoteIpValve),
# au lieu de laisser Spring Security/l'application les ignorer ou les interpreter naivement.
# Utilise les valeurs par defaut de Tomcat pour les proxys internes de confiance.
# Voir AuthenticationController.resolveClientIp()
server.forward-headers-strategy=native

officine.jwt.secret=${OFFICINE_JWT_SECRET}
