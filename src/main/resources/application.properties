spring.application.name=officine
spring.profiles.default=dev
server.port=9005
# Client bureau officine-v1 : officine.api.base-url=http://localhost:9005/api/
# Base dev : MySQL (profil dev) — voir application-dev.properties

# Profile photos on disk (filename stored in APP_USER.PHOTO_FILENAME)
officine.user-photos.directory=${user.home}/.officine/user-photos
officine.product-photos.directory=${user.home}/.officine/product-photos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- OpenAPI / Swagger UI (springdoc) ---
# JSON OpenAPI : http://localhost:9005/v3/api-docs
# Interface Swagger : http://localhost:9005/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.officine.losto.controller,\
com.officine.losto.s1.organisation.api,\
com.officine.losto.s5.reappro.api,\
com.officine.losto.s7.stocks.api
springdoc.show-actuator=false

# Bons internes : exiger ROLE_MAGASIN_CENTRAL pour ENVOYE→TRAITE ou ENVOYE→ANNULE (SecurityContext).
officine.bon.restrict-central-warehouse-role=false

officine.currency.code=XOF
officine.currency.symbol=FCFA

# --- JWT (stateless auth) ---
# Secret Base64 (256 bits minimum). Ne jamais committer en prod — utiliser une variable d'environnement.
officine.jwt.secret=${OFFICINE_JWT_SECRET:Zm9mZmljaW5lLWRldl9qd3Rfc2VjcmV0X2tleV8yNTZfYml0cw==}
officine.jwt.access-token-expiration-ms=900000
#officine.jwt.access-token-expiration-ms=30000

officine.jwt.refresh-token-expiration-ms=604800000
officine.jwt.remember-me-refresh-token-expiration-ms=2592000000
officine.jwt.issuer=officine-api

# CORS (JavaFX / clients distants)
officine.cors.allowed-origins=*

# Client bureau JavaFX : officine.api.base-url=http://localhost:9005/api/





