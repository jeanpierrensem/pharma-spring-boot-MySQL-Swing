# --- Profil dev : MySQL local ---
# Surcharge locale (mot de passe, URL) : src/main/resources/application-dev-local.properties
# (voir application-dev-local.properties.example)
spring.config.import=optional:classpath:application-dev-local.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/officine?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Catalogue produit initial (populate) : CSV mappé aux champs Product (classe ProductCsvSeedSupport).
officine.seed.products-csv=classpath:seed/ToLoad.csv

# Au démarrage (profil dev), si le nombre de produits est inférieur à ce seuil, des articles de démo sont ajoutés.
officine.seed.demo-products-target=100

# Stock central / PDV / mouvements de démo (CommandLineRunner @Order(20), après le catalogue produit).
officine.seed.demo-stock=true

# Une ligne STOCK_CENTRAL par produit + liaison THR-STOCK-BAS (CommandLineRunner @Order(21)).
officine.seed.central-stock-all-products=true
officine.seed.central-stock-qty-min=1
officine.seed.central-stock-qty-max=500
